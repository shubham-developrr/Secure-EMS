name: Secure EMS CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ems_test
          POSTGRES_PASSWORD: ems_test
          POSTGRES_DB: ems_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ems_test -d ems_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DATABASE_URL: postgresql://ems_test:ems_test@127.0.0.1:5432/ems_test
      TESTING: "1"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest

      - name: Initialize test database
        working-directory: backend
        env:
          PGPASSWORD: ems_test
        run: |
          psql -h 127.0.0.1 -U ems_test -d ems_test -f schema.sql

      - name: Run Backend Tests (Pytest)
        run: |
          cd backend
          pytest -v

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Run Frontend Unit Tests (Vitest)
        run: |
          cd frontend
          npm test -- --run